[project]
name = "coding-env"
version = "0.1.0"
description = "Coding environment (HUD v6) for solving programming tasks via a sandboxed ssh workspace"
requires-python = ">=3.11,<3.13"
dependencies = [ "hud[agents]>=0.6.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0",]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [ "pytest>=8.0.0", "ruff==0.11.2", "pre-commit>=3.5.0",]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.hud]
image = "coding-template:dev"

[tool.ruff.lint]
select = [ "E", "F", "B", "I", "C4", "UP",]
ignore = [ "E501",]
fixable = [ "ALL",]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = [ ".",]
