[project]
name = "swe-task-example"
version = "0.1.0"
description = "One HUD coding environment; tasks are uploads (codebase, grading pack, gold.diff, llm_rubric.json)"
requires-python = ">=3.11,<3.13"
dependencies = [ "hud>=0.6.15", "httpx>=0.27.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0",]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [ "pytest>=8.0.0", "ruff==0.11.2", "pre-commit>=3.5.0",]

[tool.ruff]
target-version = "py311"
line-length = 120
# Task grader code ships inside the grading zips; it is task content, not this package.
extend-exclude = [ "tasks/*/grading",]

[tool.ruff.lint]
select = [ "E", "F", "B", "I", "C4", "UP",]
ignore = [ "E501",]
fixable = [ "ALL",]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
markers = [ "integration: requires Docker and built instance images",]

[tool.hatch.build.targets.wheel]
packages = [ ".",]
