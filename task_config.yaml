# task_config.yaml - Per-task git worktree configuration
#
# This file controls what the agent sees in the git repo and how grading works.
# At Docker build time, setup_git.py reads this file and:
#   1. Extracts test/golden patches into /home/root/patches/
#   2. Deletes grading branches from the repo
#   3. Prunes git history (optional)
#   4. Leaves .git accessible to the agent
#
# The agent gets a real git repo with full history but no access to the solution.

tasks:
  sample-json-bug:
    worktree:
      # Branch the agent starts on (checked out at scenario start)
      checkout: server_fix_baseline

      # Branches visible to the agent (optional)
      # If omitted: ALL branches except grading branches are kept
      include_branches:
        - server_fix_baseline

      # Optional: truncate history to commits before this date (ISO 8601)
      # Useful for "the repo as it was on date X" scenarios
      # snapshot_before: "2026-01-15T00:00:00Z"

    grading:
      # These branches are used to generate patches, then DELETED from the repo
      test_branch: server_fix_test
      golden_branch: server_fix_golden

      # Test files injected by test.patch at grading time
      test_files:
        - test_server.py

      # Test command (optional, default: "pytest {test_files} -v")
      # test_command: "pytest {test_files} -v"

    # Prompt shown to the agent (used by both HUD scenarios and Taiga tools)
    prompt: |
      Fix the JSON serialization bug in server.py.

      The API server's responses are malformed. When you make a request to any endpoint,
      the response body is not valid JSON - it looks like a Python dict representation
      instead of proper JSON (e.g., single quotes instead of double quotes).

      Hint: use git log and git blame to investigate when the bug was introduced.


